<canvas #bg class="bg"></canvas>
<div class="aurora"></div>

<section class="hero">
  <div class="prompt fade" style="--d: 0">
    <span class="dollar">$</span> whoami
  </div>

  <h1 class="fade" style="--d: 1" aria-label="Parisius" (mouseenter)="morph('Paride')" (mouseleave)="morph('Parisius')">
    <span class="name" aria-hidden="true">@for (g of glyphs(); track $index) {<span class="g" [class.scr]="!g.done">{{ g.ch }}</span>}</span>&#8203;
  </h1>

  <div class="typed fade" style="--d: 3">
    <span class="slashes">//</span> {{ typed() }}<span class="caret"></span>
  </div>

  <nav class="links fade" style="--d: 4">
    <a href="https://github.com/jasoc" target="_blank" rel="noopener">github</a>
    <a href="https://www.linkedin.com/in/paride-giunta-96264918b/" target="_blank" rel="noopener">linkedin</a>
    <a href="https://www.instagram.com/_parisius_/" target="_blank" rel="noopener">instagram</a>
    <a href="https://steamcommunity.com/id/jasoc/" target="_blank" rel="noopener">steam</a>
    <button type="button" class="lucky" [class.rolling]="rolling()" (click)="feelingLucky()" title="Opens a random link">i'm feeling lucky</button>
  </nav>
</section>

<footer class="fade" style="--d: 6">parisius.dev</footer>
