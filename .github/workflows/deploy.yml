name: Build and publish

# Builds the Angular app on main and pushes the static output to the gh-pages branch.
# GitHub Pages must publish from: branch gh-pages, folder / (root).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      # SPA deep links (/nuke-sim, /apps …): Pages serves 404.html for unknown paths
      - name: SPA fallback
        run: |
          cp dist/site/browser/index.html dist/site/browser/404.html
          touch dist/site/browser/.nojekyll

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist/site/browser
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: deploy ${{ github.sha }}
