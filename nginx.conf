# Behaves like GitHub Pages: real files are served as-is, unknown paths get 404.html
# (a copy of index.html), so Angular routes like /nuke-sim work on reload.
server {
  listen 80;
  root /usr/share/nginx/html;
  absolute_redirect off;

  location / {
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;
}
